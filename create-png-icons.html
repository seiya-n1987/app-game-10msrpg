<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PNG Icon Generator - 10分RPG</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { color: #f0a500; }
        .instructions {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .icons {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        .icon-container {
            text-align: center;
        }
        canvas {
            border: 2px solid #f0a500;
            background: white;
            display: block;
            margin: 10px 0;
        }
        button {
            background: #f0a500;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 4px;
            margin: 5px;
        }
        button:hover {
            background: #ffb733;
        }
    </style>
</head>
<body>
    <h1>PNG Icon Generator</h1>

    <div class="instructions">
        <h2>手順:</h2>
        <ol>
            <li>下の「アイコンを生成」ボタンをクリック</li>
            <li>各アイコンの下にある「ダウンロード」ボタンをクリック</li>
            <li>ダウンロードしたファイルをプロジェクトのルートに配置</li>
        </ol>
    </div>

    <button onclick="generateIcons()" style="font-size: 18px; padding: 15px 30px;">アイコンを生成</button>

    <div class="icons" id="icons-container"></div>

    <script>
        function generateIcon(size) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#0f3460');
            gradient.addColorStop(0.5, '#16213e');
            gradient.addColorStop(1, '#1a1a2e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Border
            ctx.strokeStyle = '#f0a500';
            ctx.lineWidth = size * 0.05;
            ctx.strokeRect(size * 0.05, size * 0.05, size * 0.9, size * 0.9);

            // Draw sword
            ctx.fillStyle = '#e94560';
            ctx.beginPath();
            ctx.moveTo(size * 0.3, size * 0.7);
            ctx.lineTo(size * 0.7, size * 0.3);
            ctx.lineTo(size * 0.75, size * 0.35);
            ctx.lineTo(size * 0.35, size * 0.75);
            ctx.closePath();
            ctx.fill();

            // Draw shield
            ctx.fillStyle = '#3498db';
            ctx.beginPath();
            ctx.arc(size * 0.6, size * 0.6, size * 0.15, 0, Math.PI * 2);
            ctx.fill();

            // Inner circle on shield
            ctx.strokeStyle = '#2980b9';
            ctx.lineWidth = size * 0.02;
            ctx.stroke();

            // Text "10分"
            ctx.fillStyle = '#f0a500';
            ctx.font = `bold ${size * 0.18}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText('10分', size * 0.5, size * 0.92);

            // Subtitle "RPG"
            ctx.font = `bold ${size * 0.1}px Arial, sans-serif`;
            ctx.fillStyle = '#e94560';
            ctx.fillText('RPG', size * 0.5, size * 0.25);

            return canvas;
        }

        function generateIcons() {
            const container = document.getElementById('icons-container');
            container.innerHTML = '';

            [192, 512].forEach(size => {
                const canvas = generateIcon(size);
                const div = document.createElement('div');
                div.className = 'icon-container';

                const title = document.createElement('h3');
                title.textContent = `${size}x${size}`;
                title.style.color = '#f0a500';

                const displayCanvas = generateIcon(size);
                if (size === 512) {
                    displayCanvas.style.width = '256px';
                    displayCanvas.style.height = '256px';
                }

                const downloadBtn = document.createElement('button');
                downloadBtn.textContent = `icon-${size}.png をダウンロード`;
                downloadBtn.onclick = () => {
                    canvas.toBlob((blob) => {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `icon-${size}.png`;
                        a.click();
                        URL.revokeObjectURL(url);
                    });
                };

                div.appendChild(title);
                div.appendChild(displayCanvas);
                div.appendChild(downloadBtn);
                container.appendChild(div);
            });
        }

        // Auto-generate on load
        window.addEventListener('load', generateIcons);
    </script>
</body>
</html>
